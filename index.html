<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Ravi Teja — Senior Software Engineer specializing in React, TypeScript, and full-stack JavaScript. Portfolio showcasing projects, experience, and open-source work." />
  <link rel="preload" as="image" href="/images/avatar.webp" type="image/webp" fetchpriority="high" />
  <title>Ravi Teja | Senior Software Engineer</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <style>
    html { background: #f3f3f3; }
    html.dark { background: #202020; color-scheme: dark; }
    body {
      margin: 0;
      background: #f3f3f3;
      color: #1b1b1b;
      font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    html.dark body { background: #202020; color: #ffffff; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
